<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone triage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;background:#F4F1EA;color:#1F1B16}
a{color:#D9480F}a:hover{color:#B23A0A}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#F4F1EA;overflow:hidden;position:relative">

<div style="padding:22px 20px 8px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between;align-items:center">
<div style="font-family:'Fraunces',serif;font-weight:600;font-size:30px;line-height:1.1">Triage</div>
<div class="av" style="background:#E9DFC9;color:#5B4A25;width:36px;height:36px">SR</div>
</div>
<div style="font-size:13px;color:#5E574B">Four need a reply</div>
</div>

<div style="display:flex;gap:8px;padding:8px 20px 12px;overflow:hidden">
<sc-for list="{{queues}}" as="q">
<span class="chip" style="{{q.style}}">{{q.label}}</span>
</sc-for>
</div>

<div style="flex-grow:1;padding:0 20px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
<sc-for list="{{cards}}" as="t">
<div style="{{t.cardStyle}}">
<div class="av" style="{{t.avStyle}}">{{t.initials}}</div>
<div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px">
<div style="display:flex;justify-content:space-between"><span style="font-size:14px;font-weight:600">{{t.name}}</span><span style="font-size:12px;color:#8C8474">{{t.time}}</span></div>
<div style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.subject}}</div>
<div style="font-size:13px;color:#5E574B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.preview}}</div>
<div style="display:flex;gap:6px;margin-top:5px"><span class="chip" style="background:#FDEBE3;color:#9A3412">{{t.chip}}</span><sc-if value="{{t.draft}}" hint-placeholder-val="{{ true }}"><span class="chip" style="background:#EDEAFB;color:#4B3FA8">Draft ready</span></sc-if></div>
</div>
</div>
</sc-for>
<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#F0E9FD;color:#4C1D95;font-size:13px;line-height:1.4"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px;flex-shrink:0"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg>9 newsletters unopened for 60 days. Review?</div>
</div>

<div style="position:absolute;right:20px;bottom:100px;width:56px;height:56px;border-radius:18px;background:#1F1B16;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(31,27,22,.28)"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>

<div style="display:flex;justify-content:space-around;padding:12px 8px 26px;background:#FBF9F4;border-top:1px solid #E7E2D6">
<sc-for list="{{tabs}}" as="b">
<div style="{{b.style}}"><svg class="ico" viewBox="0 0 24 24"><path d="{{b.d}}"/><path d="{{b.d2}}"/></svg><span style="font-size:11px;font-weight:500">{{b.label}}</span></div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const chipOn = 'background:#1F1B16;color:#fff;padding:6px 12px;font-size:13px';
const chipOff = 'background:#fff;border:1px solid #E7E2D6;color:#5E574B;padding:6px 12px;font-size:13px';
const queues = [
{ label: 'To reply 4', style: chipOn },
{ label: 'Waiting 6', style: chipOff },
{ label: 'FYI 18', style: chipOff },
{ label: 'News 23', style: chipOff },
];
const card = (sel) => 'display:flex;gap:12px;padding:14px;border-radius:14px;background:#fff;box-sizing:border-box;' + (sel ? 'border:1.5px solid #D9480F;box-shadow:0 6px 18px rgba(217,72,15,.12)' : 'border:1px solid #E7E2D6');
const av = (bg, fg) => 'background:' + bg + ';color:' + fg;
const cards = [
{ initials: 'ML', name: 'Maya Lindqvist', time: '9:42', subject: 'Contract draft v3: can you confirm the dates?', preview: 'Attaching the revised draft. Could you confirm...', chip: 'Direct question', draft: true, cardStyle: card(true), avStyle: av('#FBE6EF', '#9D174D') },
{ initials: 'NS', name: 'Northwind Studio', time: '8:15', subject: 'Invoice question for September', preview: 'The total on invoice 2041 differs from the quote...', chip: 'Direct question', draft: true, cardStyle: card(false), avStyle: av('#DCE6F7', '#26467F') },
{ initials: 'AO', name: 'Dr. Amara Okafor', time: 'Yesterday', subject: 'Rescheduling Thursday\'s call', preview: 'Would Friday at 10:00 suit you instead?', chip: 'Needs a time', draft: false, cardStyle: card(false), avStyle: av('#E4F3E9', '#166534') },
{ initials: 'TR', name: 'Tomás Rey', time: 'Yesterday', subject: 'Quick intro?', preview: 'A mutual contact suggested we talk...', chip: 'New contact', draft: false, cardStyle: card(false), avStyle: av('#FDF0D2', '#854D0E') },
];
const on = 'display:flex;flex-direction:column;align-items:center;gap:3px;color:#D9480F;';
const off = 'display:flex;flex-direction:column;align-items:center;gap:3px;color:#8C8474;';
const tabs = [
{ label: 'Triage', d: 'M22 12h-6l-2 3h-4l-2-3H2', d2: 'M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z', style: on },
{ label: 'Assistant', d: 'M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z', d2: 'M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z', style: off },
{ label: 'Rules', d: 'M13 2L4 14h7l-1 8 9-12h-7z', d2: 'M13 2', style: off },
{ label: 'Senders', d: 'M3 6h18M8 6V4h8v2', d2: 'M6 6l1 14h10l1-14', style: off },
];
return { queues, cards, tabs };
}
}
</script>
</body>
</html>
