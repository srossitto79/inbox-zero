# Fork overlay: builds the web image from this checkout and adds the Gmail
# polling fallback and the calendar poller. See "About this fork" in README.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.fork.yml \
#     --env-file apps/web/.env --profile all up -d --build
services:
  web:
    image: inbox-zero-fork:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    # Server mailbox files when NEXT_PUBLIC_MAIL_STORE=server, and calendar sync.
    environment:
      MAIL_STORE_DIR: /data/mail
      CALENDAR_SYNC_ENABLED: ${CALENDAR_SYNC_ENABLED:-true}
    volumes:
      - mail-store-data:/data/mail

  # Idles unless GMAIL_POLLING_ENABLED=true; with Pub/Sub the watch handles new mail.
  gmail-poller:
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache curl &&
        while true; do
          if [ \"$${GMAIL_POLLING_ENABLED}\" = \"true\" ]; then
            curl -s -m 290 -X GET 'http://web:3000/api/cron/poll-gmail' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[gmail-poller] request failed\"
            sleep 60
          else
            sleep 3600
          fi
        done
      "
    env_file:
      - path: ${INBOX_ZERO_ENV_FILE:-./apps/web/.env}
        required: false
    depends_on:
      - web
    networks:
      - inbox-zero-network
    restart: always

  calendar-poller:
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache curl &&
        while true; do
          curl -s -m 290 -X GET 'http://web:3000/api/cron/sync-calendars' -H \"Authorization: Bearer $${CRON_SECRET}\" || echo \"[calendar-poller] request failed\"
          sleep 300
        done
      "
    env_file:
      - path: ${INBOX_ZERO_ENV_FILE:-./apps/web/.env}
        required: false
    depends_on:
      - web
    networks:
      - inbox-zero-network
    restart: always

volumes:
  mail-store-data:
